<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0f4d">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.45' stop-color='%23c9d6ff'/%3E%3Cstop offset='1' stop-color='%23606a9a'/%3E%3C/radialGradient%3E%3CclipPath id='c'%3E%3Ccircle cx='32' cy='35' r='24'/%3E%3C/clipPath%3E%3C/defs%3E%3Cpath d='M32 2v9' stroke='%231c0a33' stroke-width='3'/%3E%3Ccircle cx='32' cy='35' r='24' fill='url(%23g)'/%3E%3Cg clip-path='url(%23c)' stroke='%231c0a33' stroke-width='1.6' opacity='.55'%3E%3Cpath d='M8 23h48M8 31h48M8 39h48M8 47h48M8 55h48'/%3E%3Cpath d='M20 11v48M28 11v48M36 11v48M44 11v48' /%3E%3C/g%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='21' y='24' width='6' height='6' fill='%23fff'/%3E%3Crect x='37' y='40' width='6' height='6' fill='%23ff4fa0'/%3E%3Crect x='29' y='48' width='6' height='6' fill='%2335d0ff'/%3E%3Crect x='45' y='24' width='6' height='6' fill='%23ffd93d'/%3E%3C/g%3E%3Ccircle cx='32' cy='35' r='24' fill='none' stroke='%231c0a33' stroke-width='3'/%3E%3Cpath d='M54 6l2 5 5 2-5 2-2 5-2-5-5-2 5-2z' fill='%23ffd93d' stroke='%231c0a33' stroke-width='1.2'/%3E%3C/svg%3E">
<title>Strictly Score Guess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c0a33; --purple:#3b1470; --purple2:#2b0f4d; --pink:#ff4fa0; --yellow:#ffd93d; --cyan:#35d0ff; --green:#3ddc84; --orange:#ff9f1c; --red:#ff4d4d;
  --cream:#fff7e0; --cream2:#ffeab5;
  --title:'Lilita One','Arial Rounded MT Bold','Chalkboard SE',ui-rounded,system-ui,sans-serif;
  --body:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --line:4px solid var(--ink);
  --shadow:0 6px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);font-weight:500;color:var(--ink);overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#7a2fd0 0%,transparent 60%),radial-gradient(ellipse at 0% 100%,#ff4fa088 0%,transparent 50%),
  radial-gradient(ellipse at 100% 100%,#35d0ff66 0%,transparent 50%),linear-gradient(180deg,#3b1470,#1c0a33)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px clamp(10px,2.5vw,26px);flex:none;
  background:linear-gradient(180deg,var(--pink),#d1257a);border-bottom:var(--line);box-shadow:0 4px 0 #0005}
.logo{font-family:var(--title);font-size:clamp(20px,3.4vw,40px);color:var(--yellow);letter-spacing:.03em;line-height:1;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);cursor:pointer;white-space:nowrap}
.logo small{display:block;font-size:.34em;letter-spacing:.35em;color:#fff;text-shadow:0 2px 0 var(--ink);-webkit-text-stroke:1px var(--ink);margin-top:2px}
.hdr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill.wk{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.themetag{position:absolute;z-index:4;top:46px;left:14px;max-width:70%;font-family:var(--title);background:var(--cyan);border:var(--line);border-radius:14px;padding:2px 14px;font-size:clamp(14px,2vw,22px);transform:rotate(-2deg);box-shadow:0 4px 0 var(--ink);opacity:0;animation:drop .7s 2.2s cubic-bezier(.2,1.8,.4,1) forwards}
.award{display:flex;gap:10px;align-items:center;font-family:var(--title);font-size:clamp(15px,2vw,22px);padding:6px 0;border-bottom:3px dashed #0002}
.award:last-child{border:0}
label.hint{display:block;margin:0 0 2px;font-weight:600}
.pill{font-family:var(--title);background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:clamp(12px,1.5vw,16px);box-shadow:0 3px 0 var(--ink)}
main{flex:1;overflow:auto;padding:clamp(10px,2.2vw,26px);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:1150px;margin:auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}to{transform:none;opacity:1}}

h1,h2,h3{font-family:var(--title);font-weight:400}
h2.t{font-size:clamp(28px,5vw,58px);color:var(--yellow);text-align:center;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1.05;margin-bottom:6px}
.sub{font-family:var(--title);text-align:center;color:#fff;font-size:clamp(14px,2vw,22px);margin-bottom:16px;text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
h3{font-size:clamp(20px,2.4vw,28px);margin-bottom:10px}

button{font-family:var(--title);font-size:clamp(14px,1.7vw,19px);letter-spacing:.03em;cursor:pointer;color:var(--ink);background:var(--yellow);
  border:var(--line);border-radius:16px;padding:10px 20px;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;position:relative}
button:hover{transform:translateY(-2px) rotate(-1deg)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
button.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
button.cyan{background:var(--cyan)}
button.green{background:var(--green)}
button.white{background:#fff}
button.red{background:var(--red);color:#fff}
button.big{font-size:clamp(18px,2.6vw,30px);padding:14px 34px;border-radius:22px}
button.sm{font-size:13px;padding:5px 12px;border-width:3px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
button.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

.card{background:var(--cream);border:var(--line);border-radius:22px;padding:clamp(12px,2vw,22px);box-shadow:var(--shadow),0 14px 30px #0006;margin-bottom:16px}
.card.dark{background:var(--purple2);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],textarea{width:100%;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font:600 16px var(--body);background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 4px var(--cyan)}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;opacity:.7;margin-top:4px}
.center{text-align:center}

/* avatars & chips */
.av{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:3px solid var(--ink);font-size:1em;flex:none;line-height:1}
button.av{padding:0;width:2.2em;height:2.2em;font-size:22px;border-radius:50%;box-shadow:0 3px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 5px;background:#fff;font-family:var(--title);font-size:18px;
  box-shadow:0 3px 0 var(--ink);cursor:pointer;user-select:none;transition:transform .1s}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.off{opacity:.45;filter:grayscale(1);background:#ddd}
.chips{display:flex;gap:10px;flex-wrap:wrap}

/* judges */
.judges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:620px){.judges{grid-template-columns:repeat(2,1fr)}}
.judge{text-align:center}
.portrait{width:100%;max-width:170px;aspect-ratio:1;border-radius:50%;border:var(--line);background:radial-gradient(circle at 50% 25%,#ffe27a,#ff9ecb);overflow:hidden;margin:0 auto 6px;box-shadow:var(--shadow)}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
.jname{font-family:var(--title);font-size:clamp(14px,1.8vw,20px)}

/* keypad */
.keyrow{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:14px;align-items:center;margin-bottom:12px}
.keyrow .judge{display:flex;align-items:center;gap:10px;text-align:left}
.keyrow .portrait{width:clamp(46px,7vw,74px);margin:0;flex:none;box-shadow:0 3px 0 var(--ink);border-width:3px}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,.8vw,9px)}
.keys button{padding:0;aspect-ratio:1;font-size:clamp(15px,2.8vw,32px);border-radius:14px;border-width:3px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.keys button:hover{background:var(--cream2)}
.keys button.sel{background:var(--pink);color:#fff;transform:translateY(-4px) scale(1.12);text-shadow:0 2px 0 var(--ink);animation:wob .4s}
@keyframes wob{30%{transform:translateY(-8px) scale(1.2) rotate(-6deg)}60%{transform:translateY(-3px) scale(1.1) rotate(4deg)}}
@media(max-width:560px){.keyrow{grid-template-columns:1fr}.keys{grid-template-columns:repeat(5,1fr)}}
.totalbox{font-family:var(--title);text-align:center;font-size:clamp(22px,3.2vw,36px)}

/* stage */
.stage{position:relative;overflow:hidden;border:var(--line);border-radius:26px;box-shadow:var(--shadow),0 16px 40px #000a;min-height:clamp(320px,62vh,640px);
  background:radial-gradient(ellipse at 50% 120%,#ffd93d 0%,#ff9f1c55 25%,transparent 60%),linear-gradient(180deg,#2b0f4d,#12041f);display:flex;align-items:center;justify-content:center}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#7a4a18 0 60px,#8d5a22 60px 120px);border-top:var(--line);z-index:1}
.beam{position:absolute;top:-10%;width:34%;height:130%;transform-origin:50% 0;opacity:.35;mix-blend-mode:screen;
  background:linear-gradient(180deg,#fff 0%,transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
.beam.b1{left:8%;animation:sweepL 5s ease-in-out infinite alternate;background:linear-gradient(180deg,#ff4fa0,transparent 85%)}
.beam.b2{right:8%;animation:sweepR 6s ease-in-out infinite alternate;background:linear-gradient(180deg,#35d0ff,transparent 85%)}
@keyframes sweepL{from{transform:rotate(-24deg)}to{transform:rotate(14deg)}}
@keyframes sweepR{from{transform:rotate(24deg)}to{transform:rotate(-14deg)}}
.curtain{position:absolute;top:0;bottom:0;width:52%;z-index:5;border:var(--line);
  background:repeating-linear-gradient(90deg,#c1121f 0 28px,#e63946 28px 56px,#a50f1a 56px 70px)}
.curtain.l{left:0;border-left:0;animation:openL 1.5s .5s cubic-bezier(.7,0,.3,1) forwards}
.curtain.r{right:0;border-right:0;animation:openR 1.5s .5s cubic-bezier(.7,0,.3,1) forwards}
@keyframes openL{to{transform:translateX(-102%)}}
@keyframes openR{to{transform:translateX(102%)}}
.pelmet{position:absolute;top:0;left:0;right:0;height:34px;z-index:6;background:var(--yellow);border-bottom:var(--line);
  background-image:radial-gradient(circle at 20px 34px,var(--pink) 18px,transparent 19px);background-size:40px 100%}
.ballwrap{position:absolute;top:34px;left:50%;z-index:2;transform-origin:50% 0;animation:swing 3s ease-in-out infinite alternate}
.ballwrap .string{width:3px;height:34px;background:var(--ink);margin:0 auto}
.ballwrap .mball{font-size:clamp(50px,9vw,96px);line-height:1;margin-left:-.5em;margin-top:-4px;filter:drop-shadow(0 0 20px #fff)}
@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.stagecontent{position:relative;z-index:3;text-align:center;padding:90px 14px 70px;max-width:100%}
.upnext{display:inline-block;font-family:var(--title);font-size:clamp(16px,2.6vw,28px);background:var(--pink);color:#fff;border:var(--line);border-radius:999px;
  padding:4px 22px;box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg);animation:drop .7s 1.6s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 2px 0 var(--ink)}
@keyframes drop{from{transform:translateY(-120px) rotate(-3deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.couplebig{font-family:var(--title);font-size:clamp(34px,8vw,96px);line-height:1.05;color:#fff;margin:12px 0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.couplebig .ln{display:block}.couplebig .wd{display:inline-block;white-space:nowrap;opacity:1;animation:none}.couplebig .amp{opacity:1;animation:none;font-size:.7em}
.couplebig .wd span{display:inline-block;opacity:0;animation:letter .6s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes letter{from{transform:translateY(-80px) rotate(-30deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
.dancetag{display:inline-block;font-family:var(--title);font-size:clamp(18px,3.4vw,38px);color:var(--ink);background:var(--yellow);border:var(--line);border-radius:18px;padding:4px 22px;
  transform:rotate(2deg);box-shadow:0 5px 0 var(--ink);opacity:0;animation:drop .7s 2.4s cubic-bezier(.2,1.8,.4,1) forwards}

/* paddles */
.paddles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,28px);margin:6px 0 10px}
.paddle{text-align:center;perspective:700px}
.paddle .face{background:#fff;color:var(--red);font-family:var(--title);font-size:clamp(40px,10vw,120px);line-height:1;border:var(--line);border-radius:50%;
  aspect-ratio:1;width:min(100%,220px);margin:6px auto 0;display:grid;place-items:center;position:relative;outline:6px solid var(--yellow);outline-offset:-14px;
  box-shadow:var(--shadow);transform:rotateX(95deg) scale(.6);opacity:0;transform-origin:50% 0}
.paddle .face:after{content:"";position:absolute;left:50%;top:100%;width:14%;height:38%;margin-left:-7%;background:#d99a4e;border:3px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.paddles{margin-bottom:clamp(40px,8vw,96px)!important}
.paddle.on .face{animation:flip .8s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes flip{from{transform:rotateX(95deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.paddle .portrait{transition:transform .3s}
.paddle.on .portrait{animation:jig .6s}
@keyframes jig{30%{transform:scale(1.12) rotate(-6deg)}60%{transform:scale(1.05) rotate(5deg)}}
.paddle .face.hi{color:var(--green);text-shadow:0 0 0 var(--ink)}
.totalbig{font-family:var(--title);text-align:center;font-size:clamp(26px,5vw,54px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);min-height:1.2em}
.banner{display:block;text-align:center;font-family:var(--title);font-size:clamp(22px,5vw,56px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);
  animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px) rotate(-2deg)}}

.weekpick{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--title);color:#fff;font-size:22px;text-shadow:0 2px 0 var(--ink)}
.weekpick b{font-size:40px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;min-width:1.4em;text-align:center}
.weekpick button{font-size:22px;width:44px;height:44px;padding:0}
/* reveal stage */
.revhead{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.revgrid{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:14px;align-items:start}
.revmain{min-width:0}
.revplayers{display:flex;flex-direction:column;gap:8px}
.rp{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;box-shadow:0 3px 0 var(--ink)}
.rp.hit{animation:wob .6s}
.rph{display:flex;align-items:center;gap:6px;font-family:var(--title);font-size:16px}
.rph .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpts{background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:0 8px;min-width:34px;text-align:center}
.rpts.bump{animation:bumpk .5s}
@keyframes bumpk{40%{transform:scale(1.5) rotate(-8deg);background:var(--green)}}
.rslots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}
.rs{position:relative;display:grid;place-items:center;height:40px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-family:var(--title);overflow:hidden}
.rs i{font-style:normal;font-size:16px;opacity:.5}
.rs em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;opacity:0}
.rs.done i{opacity:0}.rs.done em{opacity:1;animation:stamp .45s cubic-bezier(.2,1.8,.4,1)}
.rs.x{background:var(--green)}.rs.x em{font-size:22px}
.rs.n{background:var(--yellow)}
.rs.m{background:#ffb3b3;animation:shake .4s}
@keyframes stamp{from{transform:scale(2.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rbonus{display:none;margin-top:5px;font-family:var(--title);font-size:13px;text-align:center;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:10px;text-shadow:0 1px 0 var(--ink)}
.rbonus.on{display:block;animation:stamp .5s}
.revpres{display:flex;flex-direction:column;gap:8px;align-items:center}
.sp{position:relative;text-align:center;width:100%;max-width:110px}
.sp .portrait{max-width:none;width:100%;border-width:3px;box-shadow:0 3px 0 var(--ink)}
.sp small{font-family:var(--title);color:#fff;text-shadow:0 2px 0 var(--ink);font-size:13px}
.sp .clap{position:absolute;right:-6px;bottom:18px;font-size:30px;display:none}
.sp.clap .clap{display:block;animation:clap .22s infinite alternate}
.sp.clap.slow .clap{animation-duration:.6s}
.sp.clap .portrait{animation:bob .35s infinite alternate}
.sp.sad .portrait{filter:saturate(.6);transform:rotate(-4deg)}
@keyframes clap{from{transform:scale(.8) rotate(-12deg)}to{transform:scale(1.15) rotate(10deg)}}
@media(max-width:900px){.revgrid{grid-template-columns:1fr}.revplayers{order:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .revpres{order:-1;flex-direction:row;justify-content:center}.sp{max-width:70px}.sp small{font-size:11px}}
/* live judge entry */
.paddle.on.static .face{animation:none;transform:none;opacity:1}
.paddle .await{display:none}
.paddle:not(.on) .await{display:grid;place-items:center;aspect-ratio:1;width:min(100%,220px);margin:6px auto 0;border:4px dashed #ffffff66;border-radius:50%;
  font-family:var(--title);color:#fff;font-size:clamp(13px,1.8vw,24px);text-shadow:0 2px 0 var(--ink)}
.paddle.active .await{border-color:var(--yellow);color:var(--yellow);animation:pulse 1.2s infinite}
.paddle .face.preview{opacity:.35;transform:none;animation:none}
.paddle:not(.on) .face{display:none}
.paddle.active .await.num{font-size:clamp(34px,6vw,80px);color:#fff;border-style:solid;animation:none}
.revhead .realbanner{font-size:clamp(13px,1.6vw,20px);padding:2px 14px}
.paddle.active .portrait{box-shadow:0 0 0 6px var(--yellow),var(--shadow)}
.jctl{background:linear-gradient(180deg,#1c0a33,#3b1470);border:var(--line);border-color:var(--yellow);border-radius:20px;padding:10px 14px;margin:8px auto 0;max-width:640px;box-shadow:0 6px 0 var(--yellow);color:#fff;text-align:center}
.jctl label{font-family:var(--title);font-size:clamp(18px,2.4vw,26px)}
.jrow{display:flex;gap:10px;justify-content:center;margin:6px 0}
.jrow input{width:130px;font-family:var(--title);font-size:30px;text-align:center;border-color:var(--yellow);background:#fff8d6}
.jrow button.big{padding:8px 22px;font-size:clamp(16px,2vw,22px)}
.jkeys{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.jkeys button{padding:6px 0;font-size:18px;border-width:3px;background:#2b0f4d;color:var(--yellow);border-color:var(--yellow);box-shadow:0 3px 0 var(--yellow)}
.jkeys button.sel{background:var(--yellow);color:var(--ink)}
.jctl .hint{color:#fff;opacity:.75}

    <div class="logo" data-act="home">STRICTLY<small>SCORE GUESS</small></div>

<script>
(()=>{
'use strict';
/* =============== constants & state =============== */
const KEY='strictly-v2';
const VERSION='2.1.0',RELEASE='Cha-Cha';   // bump on every release; release names are dances or Strictly words (see CHANGELOG.md)
const COLORS=['#ff4fa0','#35d0ff','#3ddc84','#ffd93d','#b980ff','#ff9f1c','#7af0d8','#ff8a8a','#a3e635','#f472b6','#60a5fa','#fb923c'];
const EMOJI=['🦄','🐙','🦖','🐸','🐼','🦊','🐵','🦋','🐲','🐧','🐯','🦩','🐨','🦁','🐰','🐢'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sum=a=>a.reduce((x,y)=>x+y,0);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const defaultJudges=()=>[   // always shown in this order: Craig, Motsi, Shirley, Anton
  {name:'Craig Revel Horwood',photo:'',style:3},{name:'Motsi Mabuse',photo:'',style:1},
  {name:'Shirley Ballas',photo:'',style:0},{name:'Anton Du Beke',photo:'',style:2}];
const mkPlayer=(i,name)=>({id:uid(),name:name||'Player '+(i+1),color:COLORS[i%COLORS.length],av:EMOJI[i%EMOJI.length],here:true});
const defaultPresenters=()=>[{name:'Emma Willis',photo:''},{name:'Josh Widdicombe',photo:''},{name:'Johannes Radebe',photo:''}];
const BANDLEADER={name:'Dave Arch',photo:''};   // pops up rarely after the judges
const defaultState=()=>({v:2,presenters:defaultPresenters(),players:[mkPlayer(0),mkPlayer(1),mkPlayer(2)],judges:defaultJudges(),couples:[],season:{},history:[],rounds:[],weeksDone:0,week:null,
  tmp:[null,null,null,null],sound:true,jOrder:2,seasonTab:'players'});
let S=(()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.v===2)return Object.assign(defaultState(),{jOrder:0},o)}catch(e){}return defaultState()})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – storage full?')}};
/* one-off: put judges in show order (Craig, Motsi, Shirley, Anton) and re-order every saved score to match */
(function migrateJudgeOrder(){
  if(S.jOrder===2)return;
  S.judges.forEach((j,i)=>{if(j.style==null)j.style=i});
  const key=j=>(j.name||'').toLowerCase().split(' ')[0];

  for(let y=1;y<N-1;y++)for(let xx=1;xx<N-1;xx++){const i=y*N+xx;
    const gx=gb[i-N+1]+2*gb[i+1]+gb[i+N+1]-gb[i-N-1]-2*gb[i-1]-gb[i+N-1],gy=gb[i+N-1]+2*gb[i+N]+gb[i+N+1]-gb[i-N-1]-2*gb[i-N]-gb[i-N+1];

function makeQuips(real,guesses,order){
  const total=sum(real),tier=total>=36?'top':total>=30?'great':total>=22?'ok':'low';
  const hi=Math.max(...real),lo=Math.min(...real);
  const fn=n=>S.judges[real.indexOf(n)].name.split(' ')[0];
  const sc=order.map(id=>({id,t:scorePlayer(guesses[id],real).total}));
  const hiS=Math.max(...sc.map(x=>x.t)),loS=Math.min(...sc.map(x=>x.t));
  const bestP=sc.find(x=>x.t===hiS),worstP=sc.slice().reverse().find(x=>x.t===loS);
  const cpl=couple(entry().cid),parts=cpl.name.split('&');
  const vars={couple:cpl.name,first:firstName(parts[0]),pro:firstName(parts[1]||''),total,topJudge:fn(hi),lowJudge:fn(lo),hi,lo,dance:entry().dance||'',
    best:bestP&&player(bestP.id)?player(bestP.id).name:'',worst:worstP&&player(worstP.id)?player(worstP.id).name:''};
  const fill=t=>t.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined?vars[k]:m);
  const pickOne=a=>a[Math.floor(Math.random()*a.length)];
  const ids=shuffle([0,1,2]),n=Math.random()<.65?2:1,out=[];
  const stats=scoreStats(cpl,real,entry().dance);
  const statLine=(p,st)=>{Object.assign(vars,st);return fill(STATQ[st.k][p])};
  const split=hi-lo>=3&&Math.random()<.35;
  // presenter 1: the most exciting stat if there is one (usually), otherwise a reaction to the score
  if(stats.length&&Math.random()<.85)out.push({p:ids[0],t:statLine(ids[0],stats[0])});
  else out.push({p:ids[0],t:fill(pickOne(split?QUIPS[ids[0]].split:QUIPS[ids[0]][tier]))});
  if(n===2){
    const q=QUIPS[ids[1]],canGuess=order.length>1&&hiS>loS,fact=randomFact(cpl),r=Math.random();
    if(stats.length>1&&r<.45)out.push({p:ids[1],t:statLine(ids[1],stats[1])});
    else if(fact&&r<.65){vars.fact=fact;out.push({p:ids[1],t:fill(STATQ.fact[ids[1]])})}
    else out.push({p:ids[1],t:fill(pickOne(q[canGuess?(Math.random()<.6?'best':'worst'):tier]))});
  }

}

/* ---------- season stats (only count rounds a player actually guessed) ---------- */
function computeStats(){
  const st={};
  S.rounds.forEach(r=>Object.entries(r.g).forEach(([pid,g])=>{
    const q=st[pid]=st[pid]||{pid,n:0,abs:0,sg:0,exact:0,near:0,oracle:0,pts:0,best:0,pj:[0,0,0,0],wk:new Set()};
    q.n++;g.forEach((v,i)=>{const d=v-r.r[i];q.abs+=Math.abs(d);q.sg+=d;q.pj[i]+=Math.abs(d);if(d===0)q.exact++;else if(Math.abs(d)===1)q.near++});
    const sc=scorePlayer(g,r.r).total;q.pts+=sc;q.best=Math.max(q.best,sc);if(sum(g)===sum(r.r))q.oracle++;q.wk.add(r.w)}));
  Object.values(st).forEach(q=>{q.err=q.abs/(q.n*4);q.bias=q.sg/(q.n*4);q.exactPct=Math.round(100*q.exact/(q.n*4));q.ppr=q.pts/q.n;q.weeks=q.wk.size;q.jerr=q.pj.map(x=>x/q.n)});
  return st;
}
const pinfo=pid=>{const p=player(pid)||S.season[pid]||{};return{name:p.name||'?',av:p.av||'🙂',color:p.color||'#ccc'}};
function seasonAwards(st){
  const all=Object.values(st);if(!all.length)return[];
  let q=all.filter(x=>x.n>=3);if(!q.length)q=all;
  const pick=(arr,f,dir=1)=>arr.slice().sort((a,b)=>dir*(f(a)-f(b)))[0];
  const A=[];let x;
  x=pick(q,y=>y.err);A.push({e:'🎯',t:'Sharpshooter',x,d:`just ${x.err.toFixed(2)} off per guess`});
  x=pick(q,y=>y.ppr,-1);A.push({e:'⭐',t:'Hot Shot',x,d:`${x.ppr.toFixed(1)} pts per couple`});
  x=pick(q,y=>y.exact,-1);if(x.exact)A.push({e:'💥',t:'Bullseye Machine',x,d:`${x.exact} exact hits (${x.exactPct}%)`});
  x=pick(q,y=>y.oracle,-1);if(x.oracle)A.push({e:'🔮',t:'The Oracle',x,d:`${x.oracle} spot-on total${x.oracle>1?'s':''}`});
  x=pick(q,y=>y.bias,-1);if(x.bias>.05)A.push({e:'🎅',t:'Santa Claus',x,d:`guesses run ${x.bias.toFixed(2)} too generous`});
  x=pick(q,y=>y.bias,1);if(x.bias<-.05)A.push({e:'😈',t:'Craig Mode',x,d:`guesses run ${Math.abs(x.bias).toFixed(2)} too harsh`});
  S.judges.forEach((j,i)=>{x=pick(q,y=>y.jerr[i]);A.push({e:'🧠',t:`${j.name.split(' ')[0]}'s Mind-Reader`,x,d:`only ${x.jerr[i].toFixed(2)} off on average`})});
  x=pick(all,y=>y.best,-1);A.push({e:'🚀',t:'Biggest Night',x,d:`${x.best} pts on a single couple`});
  const tw=new Set(S.rounds.map(r=>r.w)).size;
  if(tw>1){const full=all.filter(y=>y.weeks===tw);if(full.length)A.push({e:'🎟',t:'Never Misses',x:full[0],d:`here for all ${tw} weeks`})}
  return A;
}

/* "7 8 6 10" / "78610" -> [7,8,6,10]; a lone 0 also means 10 */
function parseQuick(v){
  const out=[],d=v.replace(/[^0-9]/g,' ');
  for(const tok of d.split(/\s+/).filter(Boolean)){
    for(let i=0;i<tok.length&&out.length<4;i++){
      if(tok[i]==='1'&&tok[i+1]==='0'){out.push(10);i++}else if(tok[i]==='0')out.push(10);else out.push(+tok[i]);
    }
  }
  return out.slice(0,4);
}

    pad.classList.toggle('has',!!n);pc.textContent=n||'';pc.classList.toggle('hi',n>=9);

  });
  const done=S.tmp.every(x=>x);
  document.querySelectorAll('[data-act=confirm]').forEach(b=>{b.disabled=!done;b.classList.toggle('pulse',done)});
  // phones: number keyboards have no Enter key, so close the keyboard once all four are in and the ✓ shows
  const q=$('#quick');if(done&&q&&document.activeElement===q&&matchMedia('(pointer:coarse)').matches&&parseQuick(q.value).length===4&&!/1$/.test(q.value.trim()))q.blur();
  const t=$('#ktot');if(t)t.textContent=done?sum(S.tmp):'–';
}

/* =============== actions =============== */
/* 2026 series data (couples, looks, photos, facts, every score so far) lives in data/series2026.js */
const SD=window.SERIES_2026||{afterWeek:6,couples:[],dances:[],weekThemes:{}};
const SERIES_2026={afterWeek:SD.afterWeek,couples:SD.couples.map(c=>c.name)};
const normName=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const celebOf=n=>normName((n||'').split('&')[0]);
function presetFor(c){return c&&SD.couples.find(p=>normName(p.name)===normName(c.name)||celebOf(p.name)===celebOf(c.name))}
/* keep saved couples in step with the series data (e.g. "John Nellis" -> "John Nellis & Katya Jones") */
function applySeries(){let ch=false;S.couples.forEach(c=>{const p=presetFor(c);if(p&&!c.name.includes('&')&&normName(p.name)!==normName(c.name)){c.name=p.name;ch=true}});if(ch)save()}
const firstName=n=>(n||'').trim().split(/\s+/)[0];
function factsFor(c){const p=presetFor(c);if(!p||!p.facts)return[];return[...(p.facts.celebrity||[]),...(p.facts.pro||[])]}
function randomFact(c){const f=factsFor(c);return f.length?f[Math.floor(Math.random()*f.length)]:''}
const normDance=d=>(d||'').toLowerCase().replace(/[^a-z]/g,'').replace(/^chacha$/,'chachacha');
/* every scored dance this series: the real series so far + anything played in the game */
function seriesDances(){
  const out=SD.dances.map(([w,cel,pro,d,r])=>({w,key:normName(cel),name:cel+' & '+pro,d,r}));
  const has=(key,w)=>out.some(o=>o.key===key&&o.w===w);
  S.couples.forEach(c=>(c.scores||[]).forEach(x=>{const key=celebOf(c.name);if(!has(key,x.week))out.push({w:x.week,key,name:c.name,d:x.dance,r:x.real})}));
  if(S.week)Object.entries(S.week.results).forEach(([cid,res])=>{const c=couple(cid);if(!c)return;const e=S.week.entries.find(x=>x.cid===cid),key=celebOf(c.name);
    if(!has(key,S.week.n))out.push({w:S.week.n,key,name:c.name,d:e?e.dance:'',r:res.real,tonight:true})});
  return out;
}
/* interesting facts about this score, most exciting first */
function scoreStats(c,real,dance){
  const all=seriesDances(),key=celebOf(c.name),mine=all.filter(x=>x.key===key),total=sum(real),out=[];
  const tot=x=>sum(x.r),J=i=>firstName(S.judges[i].name);
  const n=S.week?S.week.n:0,tonight=all.filter(x=>x.w===n);
  if(total===40)out.push({k:'perfect'});
  const tens=real.map((v,i)=>v===10?i:-1).filter(i=>i>=0);
  if(tens.length&&!all.some(x=>x.r.includes(10)))out.push({k:'seriesFirstTen',judge:J(tens[0])});
  else if(tens.length&&!mine.some(x=>x.r.includes(10)))out.push({k:'firstTen',judge:J(tens[0])});
  if(all.length&&total>Math.max(...all.map(tot)))out.push({k:'seriesBest'});
  if(mine.length&&total>Math.max(...mine.map(tot)))out.push({k:'pb',prev:Math.max(...mine.map(tot))});
  const nd=normDance(dance);
  if(nd){const same=all.filter(x=>normDance(x.d)===nd);
    if(!same.length)out.push({k:'firstDance'});
    else{const best=same.reduce((a,b)=>tot(b)>tot(a)?b:a);if(total>tot(best))out.push({k:'bestDance',prevBest:tot(best),prevName:firstName(best.name)})}}
  if(real.includes(9)&&!real.includes(10)&&mine.length&&!mine.some(x=>x.r.some(v=>v>=9)))out.push({k:'firstNine'});
  const last=mine.filter(x=>x.w<n).sort((a,b)=>b.w-a.w)[0];
  if(last){const d=total-tot(last);if(d>=5)out.push({k:'improved',diff:d,last:tot(last)});else if(d<=-5)out.push({k:'dropped',diff:-d,last:tot(last)})}
  if(mine.length>=2&&total<Math.min(...mine.map(tot)))out.push({k:'worst'});
  if(real.every(v=>v===real[0]))out.push({k:'sameAll',n:real[0]});
  const lo=Math.min(...real),hi=Math.max(...real);
  if(hi-lo>=2&&real.filter(v=>v===lo).length===1)out.push({k:'harsh',judge:J(real.indexOf(lo)),lo});
  if(tonight.length){if(total>Math.max(...tonight.map(tot)))out.push({k:'tonightTop'});else if(total<Math.min(...tonight.map(tot)))out.push({k:'tonightBottom'})}
  return out;
}

  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    if(photoKind==='couple'){const cp=couple(i);if(cp){cp.photo=cartoonify(img);save();render();toast('Cartoonified! ✨')}return}
    const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');
    const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/3,m,m,0,0,240,240);
    (photoKind==='pres'?S.presenters:S.judges)[i].photo=c.toDataURL('image/jpeg',.85);save();render()};img.src=fr.result};
  fr.readAsDataURL(file);
}
let photoFor=0,photoKind='judge';
function startCouple(){const w=W();w.order=shuffle(w.pids);w.oi=0;w.guesses={};w.prevTotals=Object.assign({},w.totals);S.tmp=[null,null,null,null];ready=false}
function advance(){const w=W(),rem=remaining();if(!rem.length)w.phase='wrap';else if(rem.length===1){w.idx=rem[0].i;w.phase='dance'}else w.phase='pick';save();render()}
function finishWeek(){
  const w=W();
  w.entries.forEach(e=>{const r=w.results[e.cid];if(r)couple(e.cid).scores.push({week:w.n,dance:e.dance,real:r.real})});
  const rows=weekPlayerRows(false),best=rows.length?rows[0].score:0;
  const winners=best>0?rows.filter(r=>r.score===best).map(r=>r.name):[];
  w.pids.forEach(id=>{const p=player(id);if(!p)return;const s=S.season[id]=S.season[id]||{pts:0,weeks:0,wins:0};
    s.name=p.name;s.color=p.color;s.av=p.av;s.pts+=w.totals[id]||0;s.weeks++;if(best>0&&(w.totals[id]||0)===best)s.wins++});
  w.entries.forEach(e=>{const r=w.results[e.cid];if(r&&r.guesses)S.rounds.push({w:w.n,c:couple(e.cid).name,d:e.dance||'',r:r.real,g:r.guesses})});
  w.leaving.forEach(id=>{couple(id).out=w.n});
  S.history.push({n:w.n,theme:w.theme||'',winners,out:w.leaving.map(id=>couple(id).name),sick:w.entries.filter(e=>e.status==='sick').map(e=>couple(e.cid).name)});
  S.weeksDone=Math.max(S.weeksDone,w.n);S.week=null;overlay=null;save();render();
  toast(`Week ${w.n} saved! ${w.leaving.length?'👋 '+w.leaving.length+' left':''}`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,w=W();
  sfx.init();
  if(['key','togglehere','leave','mv'].indexOf(a)<0)sfx.pop();
  switch(a){
  case 'fs':{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d);return}
  case 'snd':S.sound=!S.sound;save();if(S.sound)sfx.init();return render();
  case 'home':overlay='home';return render();
  case 'nav':overlay=b.dataset.to||null;return render();
  case 'resume':overlay=null;return render();
  case 'editart':artEdit=id;overlay='art';return render();
  case 'artmode':couple(artEdit).artMode=b.dataset.v;save();return render();
  case 'artdone':overlay='manage';return render();
  case 'artset':{const c=couple(artEdit),L=looksOf(c).map(o=>Object.assign({},o)),k=b.dataset.k;c.artMode='draw';L[+b.dataset.who][k]=k==='hs'||k==='fh'?+b.dataset.v:['gl','ear','lip'].includes(k)?b.dataset.v==='1':b.dataset.v;c.look=L;save();return render()}
  case 'artrandom':{const c=couple(artEdit),r=Math.random().toString(36);c.look=[defaultLook(r,0),defaultLook(r,1)];c.photo='';save();return render()}
  case 'artphoto':photoFor=artEdit;photoKind='couple';$('#photofile').click();return;
  case 'artclearphoto':couple(artEdit).photo='';save();return render();
  case 'load2026':load2026();return;
  case 'wkstep':S.nextWeek=Math.max(1,Math.min(99,nextWeekNo()+(+b.dataset.d)));save();return render();
  case 'newweek':newWeek();overlay=null;return render();
  case 'quitweek':if(confirm('Abandon this week? Nothing from it will be saved.')){S.week=null;overlay=null;save();render()}return;
  case 'stab':S.seasonTab=b.dataset.t;save();return render();
  /* manage */
  case 'addcouples':{const t=$('#newcouples').value.split('\n').map(x=>x.trim()).filter(Boolean);
    t.forEach(n=>S.couples.push({id:uid(),name:n,out:null,scores:[]}));save();return render()}
  case 'delcouple':if(confirm('Remove this couple completely (including their scores)?')){S.couples=S.couples.filter(c=>c.id!==id);if(w)w.entries=w.entries.filter(x=>x.cid!==id);save();render()}return;
  case 'restore':couple(id).out=null;save();return render();
  case 'addplayer':S.players.push(mkPlayer(S.players.length));save();return render();
  case 'addplayerhere':S.players.push(mkPlayer(S.players.length));save();return render();
  case 'delplayer':if(S.players.length>1&&confirm('Remove this player? (Their season points stay in the table.)')){S.players=S.players.filter(p=>p.id!==id);save();render()}return;
  case 'cycleav':{const p=player(id);p.av=EMOJI[(EMOJI.indexOf(p.av)+1)%EMOJI.length];save();return render()}
  case 'photo':photoFor=+b.dataset.i;photoKind='judge';$('#photofile').click();return;
  case 'ppphoto':photoFor=+b.dataset.i;photoKind='pres';$('#photofile').click();return;
  case 'clearppphoto':S.presenters[+b.dataset.i].photo='';save();return render();
  case 'clearphoto':S.judges[+b.dataset.i].photo='';save();return render();
  case 'export':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='strictly-backup.json';a2.click();return}
  case 'import':$('#importfile').click();return;
  case 'wipe':if(confirm('Erase ALL couples, players, weeks and scores from this browser?')&&confirm('Really sure? This cannot be undone.')){localStorage.removeItem(KEY);S=defaultState();overlay=null;render()}return;
  /* setup */
  case 'togglehere':{const p=player(id);p.here=!p.here;save();return render()}
  case 'togglesick':{const en=w.entries[+b.dataset.i];en.status=en.status==='sick'?'dance':'sick';save();return render()}
  case 'mv':{const i=+b.dataset.i,d=+b.dataset.d,j=i+d;if(j<0||j>=w.entries.length)return;[w.entries[i],w.entries[j]]=[w.entries[j],w.entries[i]];save();return render()}
  case 'shuffleorder':w.entries=shuffle(w.entries);save();return render();
  case 'startweek':{w.pids=S.players.filter(p=>p.here).map(p=>p.id);w.totals={};w.pids.forEach(p=>w.totals[p]=0);
    advance();return}
  /* game */
  case 'pickc':w.idx=+b.dataset.i;w.phase='dance';save();return render();
  case 'danced':startCouple();w.phase='guess';save();return render();
  case 'cantdance':if(confirm('Mark this couple as absent this week and skip them?')){entry().status='sick';advance()}return;
  case 'ready':ready=true;render();focusQuick();return;
  case 'key':sfx.key();S.tmp[+b.dataset.j]=+b.dataset.n;justSet=+b.dataset.j;save();return render();
  case 'confirm':
    if(w.phase==='guess'){w.guesses[w.order[w.oi]]=S.tmp.slice();S.tmp=[null,null,null,null];ready=false;w.oi++;if(w.oi>=w.order.length)w.phase='real'}
    else if(w.phase==='real'){const r=S.tmp.slice();w.results[entry().cid]={real:r,guesses:JSON.parse(JSON.stringify(w.guesses)),quips:makeQuips(r,w.guesses,w.order)};
      w.order.forEach(pid=>{w.totals[pid]=(w.totals[pid]||0)+scorePlayer(w.guesses[pid],r).total});S.tmp=[null,null,null,null];w.phase='reveal'}
    save();return render();
  case 'fixscores':{const res=w.results[entry().cid];w.order.forEach(pid=>{w.totals[pid]=(w.totals[pid]||0)-scorePlayer(res.guesses[pid],res.real).total});
    S.tmp=[null,null,null,null];delete w.results[entry().cid];w.phase='real';save();return render()}
  case 'jkey':{const q=$('#jscore'),n=+b.dataset.n;if(jVal()===n){liveConfirm();return}q.value=n;liveSetPending(n);return}
  case 'jconfirm':liveConfirm();return;
  case 'skipreveal':window.__skip&&window.__skip();return;
  case 'board':w.phase='board';save();return render();
  case 'next':advance();return;
  case 'toelim':w.phase='elim';save();return render();
  case 'leave':{const i=w.leaving.indexOf(id);i<0?w.leaving.push(id):w.leaving.splice(i,1);save();return render()}
  case 'finishweek':finishWeek();return;
  }
});
/* text inputs write straight into state (no re-render so focus is kept) */
document.addEventListener('input',e=>{
  if(e.target.id==='jscore'){liveSetPending(jVal());return}
  if(e.target.id==='quick'){const prev=S.tmp.slice(),v=parseQuick(e.target.value);S.tmp=[0,1,2,3].map(i=>v[i]||null);save();syncKeypad(prev);return}
  const t=e.target,d=t.dataset.bind;if(!d)return;const [k,id,f]=d.split(':');
  if(k==='weekn'){W().n=Math.max(1,parseInt(t.value)||1);save();hdr();return}
  if(k==='theme'){W().theme=t.value;save();hdr();return}
  if(k==='couple')couple(id)[f]=t.value;
  else if(k==='player')player(id)[f]=t.value;
  else if(k==='judge')S.judges[+id][f]=t.value;
  else if(k==='pres')S.presenters[+id][f]=t.value;
  else if(k==='dance'){W().entries[+id].dance=t.value;const dt=$('#dtag');if(dt){dt.style.display=t.value?'':'none';dt.querySelector('span').textContent=t.value}}
  save();
});
document.addEventListener('change',e=>{
  if(e.target.id==='photofile'&&e.target.files[0]){resizePhoto(e.target.files[0],photoFor);e.target.value=''}
  if(e.target.id==='importfile'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.v!==2)throw 0;S=Object.assign(defaultState(),o);save();overlay=null;render();toast('Backup restored!')}catch(x){alert('That file is not a valid backup.')}};fr.readAsText(e.target.files[0]);e.target.value=''}
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='jscore'&&e.key==='Enter'){e.preventDefault();liveConfirm();return}
  if(e.target.id==='quick'&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-act=confirm]');if(b&&!b.disabled)b.click();return}
  if(!overlay&&W()&&W().phase==='guess'&&!ready&&(e.key==='Enter'||e.key===' ')&&!e.target.matches('input,textarea')){e.preventDefault();ready=true;render();focusQuick();return}
  const w=W();if(overlay||!w||w.phase!=='guess'||(w.phase==='guess'&&!ready)||e.target.matches('input,textarea'))return;
  if(e.key==='Enter'){const b=document.querySelector('[data-act=confirm]');if(b&&!b.disabled)b.click();return}
  if(e.key==='Backspace'){for(let i=3;i>=0;i--)if(S.tmp[i]){S.tmp[i]=null;break}save();render();return}
  if(/^[0-9]$/.test(e.key)){let n=e.key==='0'?10:+e.key,j=S.tmp.findIndex(x=>!x);if(j<0){S.tmp=[null,null,null,null];j=0}S.tmp[j]=n;justSet=j;sfx.key();save();render()}
});
window.__strictly={scoreStats,seriesDances,presetFor,factsFor};window.__strictlyPhase=()=>W()&&W().phase;   // for tests and debugging
applySeries();
$('#dances').innerHTML=['Waltz','Foxtrot','Quickstep','Viennese Waltz','Tango','American Smooth','Cha Cha Cha','Rumba','Samba','Salsa','Jive','Paso Doble','Charleston','Argentine Tango',"Couple's Choice",'Street/Commercial','Showdance','Musical Theatre','Contemporary'].map(d=>`<option value="${d}">`).join('');
render();
})();
