name: release
# Push a tag like v2.0.0 and this publishes a GitHub release using that version's CHANGELOG section.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME}"
          awk -v v="## ${ver} " 'index($0,v)==1{f=1;print;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          title=$(head -1 notes.md | sed 's/^## //')
          echo "TITLE=${title:-$ver}" >> "$GITHUB_ENV"
          tail -n +2 notes.md > body.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file body.md --verify-tag
